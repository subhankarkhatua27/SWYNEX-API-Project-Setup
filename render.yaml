services:
  - type: web
    name: swynex-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn fastapi_project.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health-check
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: API_KEY
        value: swynex-secret-api-key-2026
      - key: DATABASE_URL
        fromDatabase:
          name: swynex-db
          property: connectionString

databases:
  - name: swynex-db
    databaseName: swynex_db
    user: swynex_user
    plan: free
    region: oregon

